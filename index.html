function cue(){if(S.t%2===0){const c=S.q.candidates;if(c.length===1)return ['적 선봉이 정면으로 달려온다.','적이 물러나지만 군기는 흐트러지지 않는다.','적 군기가 옆으로 돌아 들어온다.'][c[0]];if(c.length===2)return '척후 보고: '+c.map(x=>typeNames[x]).join(' 또는 ')+'.';return '먼지가 짙어 적의 다음 움직임은 불명확하다.';}if(S.t===1){if(S.ci===0)return War.eligible(S)?'선봉이 밀렸다. 적은 추격할 여력이 있다.':'적 선봉을 밀어냈다. 적은 무리한 추격을 경계한다.';if(S.ci===1)return War.eligible(S)?'적의 귀로 경계가 느슨하다. 퇴로 위협에 반응할 수 있다.':'적의 귀로 경계가 이미 단단하다. 유도에 반응하기 어렵다.';return War.eligible(S)?'적 측면이 벌어져 있다. 양동으로 병력을 모이게 할 수 있다.':'적이 이미 밀집했다. 양동으로 더 움직이게 하기 어렵다.';}return S.open?'적 배치를 저지했다. 본대로 들어갈 틈이 열렸다.':S.wins===0?'두 교전 모두 밀렸다. 수습으로 붕괴를 피할지 판단하라.':'확인된 진입로는 없다. 길목 유지나 수습 후 결전을 노려라.';}
function hint(){if(S.t%2===0){if(S.q.candidates.length===1)return '보고는 명확하다. 움직임에 맞는 병종을 지휘하라.';return '정답이 확정되지 않았다. 상대 성향과 현재 배치도 판단 근거다.';}if(S.t===1)return War.foes[S.ci].name+'의 성향: '+War.foes[S.ci].trait+' · 조건이 맞아도 반응은 보장되지 않는다.';return '길목 유지는 정보, 수습은 생존, 틈 진입은 대승을 노리는 선택이다.';}

if(h.main){$('#enemyGhost').style.backgroundImage='var(--unit-'+['cavalry','infantry','cavalry'][h.k]+')';$('#enemyGhost').className='enemyGhost show';$('#sceneSub').textContent='적의 실제 움직임: '+typeNames[h.k];enhancedImpact(!h.good);if(!h.good){$('#cinema').classList.add('shake');$('#vignette').className='vignette hit';sound('hit');}else sound('win');}else if(h.responded){$('#cutinHost').innerHTML=`<div class="cutin"><div class="cutText"><small>${War.foes[old.ci].name} · 성향 반응</small><h2>${h.title}</h2><p>“${h.cause}”</p></div></div>`;sound('drum');}else{$('#fx').insertAdjacentHTML('beforeend',`<div class="bannerCall">${h.title}</div>`);}
updateMap(n);if(!await delay(h.responded?1050:700,token))return;$('#cinema').classList.remove('shake');$('#vignette').className='vignette';$('#fx').innerHTML='';$('#cutinHost').innerHTML='';S=n;busy=false;view='result';document.querySelectorAll('.tools button').forEach(b=>b.disabled=false);timeline();updateStatus();showResult(h);}

function ending(){view='ending';if(!recorded){records.push({ci:S.ci,seed:S.seed,result:S.done,route:S.route,p:S.p,e:S.e,steps:S.t});records=records.slice(-30);try{localStorage.setItem('hwanggeon_v8_records',JSON.stringify(records));}catch{}recorded=true;}let win=S.done==='win',title=routeNames[S.route],desc=S.route==='trait'?'조건을 만들고, 적의 반응을 저지하고, 열린 틈을 끝까지 이용했다.':S.route==='recovery'?'수습으로 대열을 되살린 뒤 결전에서 승리했다.':S.route==='hold'?'무리하게 진입하지 않고 길목을 지켜냈다.':S.route==='rout'?'세 교전의 압박으로 적 본대가 무너졌다.':S.done==='loss'?'전열이 무너져 더 싸울 수 없다. 기록에서 손실이 연결된 지점을 확인하라.':'병력은 남았지만 마지막 군령으로 목표를 완수하지 못했다.';sceneText('전투 종료',win?'勝 · 승리':S.done==='loss'?'敗 · 패퇴':'退 · 철수',War.foes[S.ci].name+'과의 전투',title,desc,'전공 보고');$('#stamp').textContent=S.route==='trait'?'대승':win?'승리':S.done==='loss'?'패퇴':'철수';$('#stamp').className='stamp show'+(win?'':' bad');$('#dock').innerHTML=`<div class="resultDock endingDock screenIn"><div class="resultText"><span class="kicker">${S.t}개 장면 · SEED ${S.seed}</span><h2>${title}</h2><p>${desc}</p></div><div class="consequence"><b>남은 전열: 아군 ${S.p}/5 · 적 ${S.e}/6</b><p>선봉 ${S.h[0].good?'저지 성공':'패배'} → ${routeNames[S.route]}<br>숫자 우세만으로 승리를 선언하지 않는다.</p></div><div class="actionsRow"><button class="primary" id="replay" onclick="start(${S.ci},${S.seed})">같은 전개 재도전</button><button class="secondary" onclick="${win&&S.ci<2?'start('+(S.ci+1)+')':'home()'}">${win&&S.ci<2?'다음 전장':'군영으로'}</button></div></div>`;sound(win?'win':'hit');}
function modal(title,content){if(busy)return;lastFocus=document.activeElement;let m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<section class="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modalHead"><h2 id="modalTitle">${title}</h2><button class="tool" id="closeModal" onclick="closeModal()" aria-label="닫기">닫기 ×</button></header><div class="modalBody">${content}</div></section>`;app.append(m);$('#closeModal').focus();m.addEventListener('click',e=>{if(e.target===m)closeModal();});}

function showLog(){if(busy)return;modal('군령과 전공 기록',S&&S.h.length?S.h.map(h=>`<div class="log"><small>${h.t+1}. ${War.stages[h.t]}</small><b>${War.action(h.a).name} → ${h.title}</b><p>${h.cause}</p><p>${h.effect}</p><small>아군 ${h.p0}→${h.p} · 적 ${h.e0}→${h.e}</small></div>`).join(''):'<p>이번 전투에서 내린 군령이 없다.</p>'+records.slice(-8).reverse().map(r=>`<div class="log"><b>${War.foes[r.ci].name} · ${routeNames[r.route]}</b><small>${r.steps}장면 · 아군${r.p} · 적${r.e} · seed${r.seed}</small></div>`).join(''));}
function showRules(){if(busy)return;modal('규칙 · 구현 · 검증',`<h3>다섯 번의 판단</h3><p>선봉전 → 전황 대응 → 본대전 → 작전 수정 → 결전. 예비대·정찰 포인트·플레이어 특성 없음. 아군 전열0이면 조기 종료.</p><h3>전열과 승패</h3><p>아군5, 적6. 일반 교전은 움직임에 맞는 군령이면 적2 손실, 아니면 아군2. 노출은 실패 피해+1, 수습은 다음 피해-1. 전열은 실제 병사 수가 아니다.</p><p>적 전열0: 승리. 결전 성공+총 교전 성공2회 이상+길목 유지/수습: 일반 승리. 적 성향 반응→본대전 저지→틈 진입→결전 성공: 대승. 나머지는 철수. 대승은 별도 점수 보너스가 아니라 결과 등급이며 캠페인 자원 효과는 없다.</p><h3>중간 선택의 실제 효과</h3><p>첫 후퇴: 아군 최대1 회복, 파재의 추격 유도. 퇴로 위협: 장보 반응 유도, 무반응이면 아군 노출. 양동: 장각 반응 유도+다음 행동 후보 축소.</p><p>두 번째 길목 유지: 다음 행동 후보 축소. 수습: 최대1 회복+다음 피해1 감소, 일반 승리 가능. 틈 진입: 열린 틈이 있어야 대승 가능, 실패 피해+1.</p><h3>적 성향은 간접 효과만</h3><p>파재는 아군 전열이 적보다 높지 않을 때 추격 여력. 장보의 귀로 경계·장각의 측면 상태는 전투 seed로 결정되며 첫 대응 전에 보고된다. 조건에 맞는 유도에80% 반응. 무반응도 가능. 반응은 배치와 행동 비중만 바꾸고 체력을 직접 바꾸지 않는다.</p><p>명확 보고65%. 관측 보강은 불명확할 때 틀린 후보1개만 제외. 적 행동은 선택 전에 고정. 같은 seed라도 선택으로 배치가 바뀌면 후속 행동이 달라질 수 있다.</p><h3>전황도와 연출의 범위</h3><p>전황도는 실제 엔진의 배치·노출·진입 상태를 재현한다. 병종별 체력·진형 물리·지형 방어 판정은 없다. 이미지 흔들림·먼지·화살은 시각 효과이며 추가 피해 판정이 아니다. 병종 삽화는 Microsoft Copilot으로 생성했다.</p><h3>검증 결과</h3>${SIMSUMMARY}<p>실제 사람의 재미·승률은 검증하지 않았다. 전열 +/-와3행동 대응의 단순함, 장수별 유도 암기 위험은 남는다. 독립3전장판이며 이전 전체 캠페인/저장과 분리.</p><button class="secondary" onclick="closeModal();showDemos()">재현 경로 보기</button>`);}
function showDemos(){if(busy)return;modal('같은 전개에서 다른 군령',Object.values(DEMOS).map(x=>`<div class="log"><b>${War.foes[x.ci].name} · ${routeNames[x.route]}</b><p>${x.path.map(a=>War.action(a).short).join(' → ')}</p><button class="secondary" onclick="closeModal();start(${x.ci},${x.seed})">이 전개로 출정</button></div>`).join(''));}
document.addEventListener('keydown',e=>{if($('#modal')){if(e.key==='Escape')closeModal();if(e.key==='Tab'){let els=[...$('#modal').querySelectorAll('button,[href],input')],first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(busy)return;if(view==='command'&&['1','2','3'].includes(e.key)){e.preventDefault();execute(War.legal(S)[Number(e.key)-1]);}if(e.key==='Enter'&&view==='result'&&document.activeElement?.tagName!=='BUTTON'){e.preventDefault();nextScreen();}});
home();
</script><script>
(()=>{
 const oldParticles=particles;
 function soldiers(kind,side){let h=`<div class="shadowArmy ${side} ${kind}" id="shadow-${side}">`;for(let i=0;i<9;i++)h+=`<i style="--x:${3+i*10}%;--h:${42+(i%3)*8}%;--weapon:${side==='ally'?-8:188}deg"></i>`;return h+'</div>';}
 function battlefield(unit){let c=$('#cinema');if(!c)return null;let old=$('.shadowBattle');if(old)old.remove();let x=document.createElement('div');x.className='shadowBattle';x.innerHTML=soldiers(unit,'ally')+soldiers(['cavalry','infantry','cavalry'][S?.q?.k??0],'foe')+'<i class="impactRing"></i><i class="shockLine"></i>';c.append(x);return x;}
 function extraFX(unit,a){let host=$('#fx');if(!host)return;let h='';if(unit==='archer'&&a!=='feint'){for(let i=0;i<24;i++)h+=`<i class="arrowRain" style="left:${-25+i*3}%;top:${65+i%5*5}%;animation-delay:${i*.018}s"></i>`;}else if(unit==='infantry'&&a!=='withdraw'&&a!=='regroup'){for(let i=0;i<5;i++)h+=`<i class="spearFlash" style="top:${40+i*5}%;animation-delay:${i*.035}s"></i>`;}else if(unit==='cavalry'){for(let i=0;i<14;i++)h+=`<i class="hoofDust" style="left:${8+i*5}%;--dx:${(i-6)*18}px;animation-delay:${i*.025}s"></i>`;}host.insertAdjacentHTML('beforeend',h);}
 particles=function(unit,a){oldParticles(unit,a);let b=battlefield(unit);if(!b)return;let ally=$('#shadow-ally'),foe=$('#shadow-foe');if(a==='withdraw'){ally.classList.add('lineHold');setTimeout(()=>ally.classList.add('breakAway'),380);}else if(a==='regroup'){ally.classList.add('lineHold');}else{ally.classList.add('marchIn');foe.classList.add('marchIn');}extraFX(unit,a);};
 function enhancedImpact(bad){let c=$('#cinema'),ring=$('.impactRing'),line=$('.shockLine'),ally=$('#shadow-ally'),foe=$('#shadow-foe');ring?.classList.add('go');line?.classList.add('go');c?.classList.add('heavyShake');c?.insertAdjacentHTML('beforeend','<i class="screenCrack"></i>');let art=$('#unitArt');art?.classList.add('hitStop');setTimeout(()=>{(bad?ally:foe)?.classList.add('breakAway');c?.classList.remove('heavyShake');art?.classList.remove('hitStop');},210);};
 const oldResult=showResult;showResult=function(h){oldResult(h);let loser=h.main?(h.good?$('#shadow-foe'):$('#shadow-ally')):null;loser?.classList.add('breakAway');if(h.main&&h.good&&navigator.vibrate)navigator.vibrate([18,35,28]);if(h.main&&!h.good&&navigator.vibrate)navigator.vibrate([35,30,55]);};
})();
</script></body></html>
